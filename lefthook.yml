pre-commit:
  piped: true
  jobs:
    - name: oxlint
      run: pnpm oxlint --fix {staged_files}
      glob: "*.{js,ts,jsx,tsx}"

    - name: oxfmt
      run: pnpm oxfmt {staged_files}
      glob: "*.{js,ts,jsx,tsx}"
